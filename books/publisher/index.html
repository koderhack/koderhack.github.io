<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>ReadProof — Publisher</title>
<meta name="robots" content="noindex,nofollow"/>
<style>
:root{--bg:#f4efe8;--card:#fff;--ink:#1c1917;--muted:#78716c;--brand:#6b1d2a;--brand2:#8b2e3c;--line:#e7e0d6;--ok:#166534;--bad:#991b1b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.shell{min-height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.top{padding:18px 20px 8px}
.brand{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);font-weight:700}
.progress{display:flex;gap:6px;margin:14px 0 4px}
.progress i{flex:1;height:4px;border-radius:99px;background:var(--line)}
.progress i.on{background:var(--brand)}
.step-label{font-size:.85rem;color:var(--muted);margin-top:8px}
.main{flex:1;padding:8px 20px 24px;display:flex;flex-direction:column}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 20px;box-shadow:0 8px 24px rgba(28,25,23,.05);flex:1;display:flex;flex-direction:column}
.card h1{margin:0 0 8px;font-size:1.55rem;line-height:1.2;font-weight:700}
.card .help{margin:0 0 20px;color:var(--muted);font-size:.95rem;line-height:1.4}
label{display:block;font-size:.8rem;color:var(--muted);margin:0 0 6px;font-weight:600}
input,textarea,select{width:100%;padding:14px 14px;border:1px solid var(--line);border-radius:12px;font-size:1.05rem;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid rgba(107,29,42,.25);border-color:var(--brand)}
textarea{min-height:160px;resize:vertical}
.field{margin-bottom:4px}
.opts{display:grid;gap:10px;margin-top:4px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:1rem;font-weight:600;cursor:pointer;color:var(--ink)}
.opt:hover,.opt.on{border-color:var(--brand);background:#fdf6f7}
.opt small{display:block;font-weight:500;color:var(--muted);margin-top:4px;font-size:.85rem}
.foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px;background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.foot button{flex:1;border:none;border-radius:14px;padding:15px 12px;font-size:1rem;font-weight:700;cursor:pointer}
.btn-back{background:#fff;color:var(--ink);border:1px solid var(--line)!important}
.btn-next{background:var(--brand);color:#fff}
.btn-next:disabled{opacity:.4;cursor:not-allowed}
.msg{margin-top:14px;padding:12px;border-radius:12px;font-size:.9rem;display:none}
.msg.ok{display:block;background:#ecfdf5;color:var(--ok)}
.msg.err{display:block;background:#fef2f2;color:var(--bad)}
.addr{font-family:ui-monospace,Menlo,monospace;font-size:.8rem;word-break:break-all;background:#faf7f2;padding:10px 12px;border-radius:10px;margin-top:12px}
.hidden{display:none!important}
.file{margin-top:10px}
.summary{list-style:none;padding:0;margin:0}
.summary li{padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.summary li span{display:block;color:var(--muted);font-size:.8rem}
.qr{margin-top:16px;text-align:center}
.qr img{width:160px;height:160px;border-radius:16px;border:1px solid var(--line);background:#fff}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand">ReadProof</div>
    <div class="progress" id="progress"></div>
    <div class="step-label" id="stepLabel"></div>
  </div>
  <div class="main">
    <div class="card" id="card"></div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="foot">
    <button type="button" class="btn-back" id="btnBack"></button>
    <button type="button" class="btn-next" id="btnNext"></button>
  </div>
</div>
<script src="./app.js"></script>
</body>
</html>
